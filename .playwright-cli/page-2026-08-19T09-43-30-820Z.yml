      - generic:
        - region:
          - generic:
            - generic:
              - generic:
                - heading [level=2]: Icon Library for React Projects
                - generic:
                  - paragraph: ReUI icons are designed for teams that want a cleaner icon workflow across product UI, docs, onboarding, dashboards, settings, and marketing surfaces.
                  - paragraph: The library keeps browsing simple while giving you multiple styles and installation paths that fit shadcn-based workflows.
              - generic:
                - generic:
                  - heading [level=3]: Icon Library Features
                  - list:
                    - listitem: Handcrafted set designed for production UI instead of generic placeholder symbol packs.
                    - listitem: Four visual styles including outline, solid, duotone, and filled so the same concept can match different interface densities.
                    - listitem: Consistent grid and stroke drawn on a shared grid so icons stay crisp and align cleanly next to text at any size.
                    - listitem: Fully customizable preview with controllable color, size, style, and variant settings.
                    - listitem: Shadcn registry compatible with CLI-friendly installation aliases for teams that want copyable delivery.
                    - listitem: Category-based browsing to help you find icons by product intent instead of scanning one giant undifferentiated list.
                - generic:
                  - heading [level=3]: How Teams Use the Icon Library
                  - list:
                    - listitem: Pick a category first when you know the product area, such as finance, notifications, settings, security, or communication.
                    - listitem: Switch styles to test whether the same icon works better as outline, solid, duotone, or filled within your existing UI.
                    - listitem: Mix styles by role within a screen, such as outline for secondary actions and filled for primary ones, to guide attention.
              - region:
                - heading [level=2]: Frequently Asked Questions
                - generic:
                  - generic:
                    - heading [level=3]:
                      - button: Can I use these icons in React and shadcn projects?
                  - generic:
                    - heading [level=3]:
                      - button: How should I choose between the four icon styles?
