      - main [ref=f11e163]:
        - heading "Motion-Primitives" [level=1] [ref=f11e164]
        - paragraph [ref=f11e165]: Make your website look better with beautifully designed motion components. Easy to use. Customizable. Open Source. Built for engineers, designers, and founders.
        - paragraph [ref=f11e166]: Motion-Primitives offers a collection of reusable animated components built with Motion and Tailwind CSS. Add smooth, engaging animations to your web projects, making them more interactive and enjoyable.
        - heading "Vision" [level=2] [ref=f11e167]
        - paragraph [ref=f11e168]: As a developer, I struggled to find practical, high-quality animated components suitable for real-world projects. Motion-Primitives was created to fill this gap, providing ready-to-use, customizable components that improve marketing websites and web applications.
        - heading "Easy to Use and customize" [level=3] [ref=f11e169]
        - paragraph [ref=f11e170]: Each component has comprehensive examples and detailed documentation. You can use them directly or easily modify them to align with your custom UI kit, design system, or specific requirements.
        - heading "Built around Motion" [level=3] [ref=f11e171]
        - paragraph [ref=f11e172]:
          - text: All components are built with
          - link "Motion" [ref=f11e173] [cursor=pointer]:
            - /url: https://motion.dev/
          - text: to ensure a solid foundation and showcase the library's capabilities. Future plans include versions using CSS and Tailwind CSS only.
        - heading "Open source and community-driven" [level=3] [ref=f11e174]
        - paragraph [ref=f11e175]: Motion-Primitives is open-source. Contributions are welcome to expand and improve the collection.
