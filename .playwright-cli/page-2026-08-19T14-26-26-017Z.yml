        - heading [level=2] [ref=f7e1334]:
          - link "Cell Architecture" [ref=f7e1335] [cursor=pointer]:
            - /url: "#cell-architecture"
        - paragraph [ref=f7e1339]: "The Data Grid uses a three-layer cell composition pattern:"
        - list [ref=f7e1340]:
          - listitem [ref=f7e1341]:
            - strong [ref=f7e1342]: DataGridCell
            - text: ": Routes to the appropriate cell variant based on the column's"
            - code [ref=f7e1343]: meta.cell.variant
            - text: property
          - listitem [ref=f7e1344]:
            - strong [ref=f7e1345]: Cell Variants
            - text: ": Implement specific editing UIs for different data variants (text, number, select, etc.)"
          - listitem [ref=f7e1346]:
            - strong [ref=f7e1347]: DataGridCellWrapper
            - text: ": Provides common functionality for all cells (focus, selection, keyboard interactions)"
        - figure [ref=f7e1348]:
          - figure [ref=f7e1350]:
            - button "Copy Text" [ref=f7e1352]
            - region [ref=f7e1356]:
              - code [ref=f7e1358]:
                - generic [ref=f7e1359]: // Cell composition flow
                - generic [ref=f7e1360]: "<DataGridCell cell={cell} table={table} />"
                - generic [ref=f7e1361]: ↓
                - generic [ref=f7e1362]: "<ShortTextCell {...props} /> // Based on variant"
                - generic [ref=f7e1363]: ↓
                - generic [ref=f7e1364]: "<DataGridCellWrapper {...props}>"
                - generic [ref=f7e1365]: "{/* Cell-specific content */}"
                - generic [ref=f7e1366]: </DataGridCellWrapper>
        - paragraph [ref=f7e1367]:
          - text: Each cell variant receives the same props and wraps its content in
          - code [ref=f7e1368]: DataGridCellWrapper
          - text: ", which provides:"
        - list [ref=f7e1369]:
          - listitem [ref=f7e1370]: Focus management and visual focus ring
          - listitem [ref=f7e1371]: Selection state and highlighting
          - listitem [ref=f7e1372]: Search match highlighting
          - listitem [ref=f7e1373]: Click, double-click, and keyboard event management
          - listitem [ref=f7e1374]: Edit mode triggering (Enter, F2, Space, or typing)
        - heading [level=3] [ref=f7e1375]:
          - link "Creating Custom Cell Variants" [ref=f7e1376] [cursor=pointer]:
            - /url: "#creating-custom-cell-variants"
        - paragraph [ref=f7e1380]:
