        - paragraph [ref=f7e3296]: "The Data Grid component provides a comprehensive spreadsheet-like experience with:"
        - heading [level=3] [ref=f7e3297]:
          - link "Core Features" [ref=f7e3298] [cursor=pointer]:
            - /url: "#core-features"
        - list [ref=f7e3302]:
          - listitem [ref=f7e3303]:
            - strong [ref=f7e3304]: High Performance
            - text: ": Virtualized rows and columns for handling large datasets (10,000+ rows)"
          - listitem [ref=f7e3305]:
            - strong [ref=f7e3306]: Cell Editing
            - text: ": In-place editing with 9 different cell variants"
          - listitem [ref=f7e3307]:
            - strong [ref=f7e3308]: Cell Selection
            - text: ": Single and multi-cell selection with keyboard and mouse"
          - listitem [ref=f7e3309]:
            - strong [ref=f7e3310]: Keyboard Navigation
            - text: ": Full keyboard support with Excel-like shortcuts"
          - listitem [ref=f7e3311]:
            - strong [ref=f7e3312]: Copy/Cut/Paste
            - text: ": Full clipboard support including paste from Excel/Google Sheets"
          - listitem [ref=f7e3313]:
            - strong [ref=f7e3314]: Undo/Redo
            - text: ": Full history support for cell updates, row additions, and deletions (Ctrl/Cmd+Z, Ctrl/Cmd+Shift+Z)"
          - listitem [ref=f7e3315]:
            - strong [ref=f7e3316]: Context Menu
            - text: ": Right-click actions for cells and rows"
          - listitem [ref=f7e3317]:
            - strong [ref=f7e3318]: Search
            - text: ": Find and navigate to matching cells (Ctrl/Cmd+F)"
          - listitem [ref=f7e3319]:
            - strong [ref=f7e3320]: Filtering
            - text: ": Advanced filtering with multiple operators and drag-and-drop reordering"
          - listitem [ref=f7e3321]:
            - strong [ref=f7e3322]: Sorting
            - text: ": Multi-column sorting with drag-and-drop reordering"
          - listitem [ref=f7e3323]:
            - strong [ref=f7e3324]: Row Management
            - text: ": Add and delete rows with callbacks"
          - listitem [ref=f7e3325]:
            - strong [ref=f7e3326]: Column Features
            - text: ": Resizing, pinning (left/right), hiding, and reordering"
        - heading [level=3] [ref=f7e3327]:
          - link "Cell Variants" [ref=f7e3328] [cursor=pointer]:
            - /url: "#cell-variants-1"
        - list [ref=f7e3332]:
          - listitem [ref=f7e3333]:
            - strong [ref=f7e3334]: Text Cells
            - text: ": Short-text and long-text with auto-save"
          - listitem [ref=f7e3335]:
            - strong [ref=f7e3336]: Number Cells
            - text: ": With min/max/step constraints"
          - listitem [ref=f7e3337]:
            - strong [ref=f7e3338]: URL Cells
            - text: ": With validation and clickable links"
          - listitem [ref=f7e3339]:
            - strong [ref=f7e3340]: Date Cells
            - text: ": Calendar picker with keyboard navigation"
          - listitem [ref=f7e3341]:
            - strong [ref=f7e3342]: Select Cells
            - text: ": Single and multi-select with search"
          - listitem [ref=f7e3343]:
            - strong [ref=f7e3344]: Checkbox Cells
            - text: ": Boolean values"
          - listitem [ref=f7e3345]:
            - strong [ref=f7e3346]: File Cells
            - text: ": Upload and manage multiple files per cell"
        - heading [level=3] [ref=f7e3347]:
          - link "Advanced Features" [ref=f7e3348] [cursor=pointer]:
            - /url: "#advanced-features"
        - list [ref=f7e3352]:
          - listitem [ref=f7e3353]:
            - strong [ref=f7e3354]: Smart Paste
            - text: ": Automatically expands grid when pasting more data than fits"
          - listitem [ref=f7e3355]:
            - strong [ref=f7e3356]: Auto-Fill
            - text: ": Type to start editing, like in Excel"
          - listitem [ref=f7e3357]:
            - strong [ref=f7e3358]: Row Heights
            - text: ": Adjustable row heights (short, medium, tall, extra-tall)"
          - listitem [ref=f7e3359]:
            - strong [ref=f7e3360]: RTL Support
            - text: ": Full right-to-left language support"
          - listitem [ref=f7e3361]:
            - strong [ref=f7e3362]: Read-Only Mode
            - text: ": Lock the grid to prevent editing"
          - listitem [ref=f7e3363]:
            - strong [ref=f7e3364]: Auto-Focus
            - text: ": Focus specific cell on mount"
          - listitem [ref=f7e3365]:
            - strong [ref=f7e3366]: Accessibility
            - text: ": Full ARIA support and keyboard navigation"
        - heading [level=2] [ref=f7e3367]:
          - link "Credits" [ref=f7e3368] [cursor=pointer]:
            - /url: "#credits"
