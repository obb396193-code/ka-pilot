            - button "Copy Text" [ref=f7e1248]
            - region [ref=f7e1252]:
              - code [ref=f7e1254]:
                - generic [ref=f7e1255]: "const onFilesUpload = React.useCallback(async ({ files, rowIndex, columnId }) => {"
                - generic [ref=f7e1256]: // Upload files to your server/storage
                - generic [ref=f7e1257]: const formData = new FormData();
                - generic [ref=f7e1258]: files.forEach(file => formData.append('files', file));
                - generic [ref=f7e1260]: "const response = await fetch('/api/upload', {"
                - generic [ref=f7e1261]: "method: 'POST',"
                - generic [ref=f7e1262]: "body: formData"
                - generic [ref=f7e1263]: "});"
                - generic [ref=f7e1265]: const data = await response.json();
                - generic [ref=f7e1267]: // Return array of file metadata
                - generic [ref=f7e1268]: "return data.files.map(f => ({"
                - generic [ref=f7e1269]: "id: f.fileId,"
                - generic [ref=f7e1270]: "name: f.fileName,"
                - generic [ref=f7e1271]: "size: f.fileSize,"
                - generic [ref=f7e1272]: "type: f.fileType,"
                - generic [ref=f7e1273]: "url: f.fileUrl"
                - generic [ref=f7e1274]: "}));"
                - generic [ref=f7e1275]: "}, []);"
                - generic [ref=f7e1277]: "const onFilesDelete = React.useCallback(async ({ fileIds, rowIndex, columnId }) => {"
                - generic [ref=f7e1278]: // Delete files from your server/storage
                - generic [ref=f7e1279]: "await fetch('/api/files', {"
                - generic [ref=f7e1280]: "method: 'DELETE',"
                - generic [ref=f7e1281]: "body: JSON.stringify({ fileIds })"
                - generic [ref=f7e1282]: "});"
                - generic [ref=f7e1283]: "}, []);"
                - generic [ref=f7e1285]: "const { table, ...dataGridProps } = useDataGrid({"
                - generic [ref=f7e1286]: data,
                - generic [ref=f7e1287]: columns,
                - generic [ref=f7e1288]: onFilesUpload,
                - generic [ref=f7e1289]: onFilesDelete,
                - generic [ref=f7e1290]: "});"
        - heading [level=2] [ref=f7e1291]:
          - link "Row Selection" [ref=f7e1292] [cursor=pointer]:
