            - button "Copy Text" [ref=f7e1387]
            - region [ref=f7e1391]:
              - code [ref=f7e1393]:
                - generic [ref=f7e1394]: "import { DataGridCellWrapper } from \"@/components/data-grid/data-grid-cell-wrapper\";"
                - generic [ref=f7e1395]: "import type { DataGridCellProps } from \"@/types/data-grid\";"
                - generic [ref=f7e1397]: "export function CustomCell<TData>({"
                - generic [ref=f7e1398]: cell,
                - generic [ref=f7e1399]: tableMeta,
                - generic [ref=f7e1400]: rowIndex,
                - generic [ref=f7e1401]: columnId,
                - generic [ref=f7e1402]: isFocused,
                - generic [ref=f7e1403]: isEditing,
                - generic [ref=f7e1404]: isSelected,
                - generic [ref=f7e1405]: isSearchMatch,
                - generic [ref=f7e1406]: isActiveSearchMatch,
                - generic [ref=f7e1407]: readOnly,
                - generic [ref=f7e1408]: "}: DataGridCellProps<TData>) {"
                - generic [ref=f7e1409]: const value = cell.getValue() as CustomCellValue;
                - generic [ref=f7e1411]: return (
                - generic [ref=f7e1412]: <DataGridCellWrapper
                - generic [ref=f7e1413]: "cell={cell}"
                - generic [ref=f7e1414]: "tableMeta={tableMeta}"
                - generic [ref=f7e1415]: "rowIndex={rowIndex}"
                - generic [ref=f7e1416]: "columnId={columnId}"
                - generic [ref=f7e1417]: "isEditing={isEditing}"
                - generic [ref=f7e1418]: "isFocused={isFocused}"
                - generic [ref=f7e1419]: "isSelected={isSelected}"
                - generic [ref=f7e1420]: "isSearchMatch={isSearchMatch}"
                - generic [ref=f7e1421]: "isActiveSearchMatch={isActiveSearchMatch}"
                - generic [ref=f7e1422]: "readOnly={readOnly}"
                - generic [ref=f7e1423]: ">"
                - generic [ref=f7e1424]: "{/* Your custom cell content */}"
                - generic [ref=f7e1425]: </DataGridCellWrapper>
                - generic [ref=f7e1426]: );
                - generic [ref=f7e1427]: "}"
        - heading [level=2] [ref=f7e1428]:
          - link "Column Configuration" [ref=f7e1429] [cursor=pointer]:
            - /url: "#column-configuration"
