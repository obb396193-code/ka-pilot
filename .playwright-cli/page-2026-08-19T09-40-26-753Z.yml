      - region "Icon Library for React Projects" [ref=e817]:
        - generic [ref=e819]:
          - generic [ref=e820]:
            - heading "Icon Library for React Projects" [level=2] [ref=e821]
            - generic [ref=e822]:
              - paragraph [ref=e823]: ReUI icons are designed for teams that want a cleaner icon workflow across product UI, docs, onboarding, dashboards, settings, and marketing surfaces.
              - paragraph [ref=e824]: The library keeps browsing simple while giving you multiple styles and installation paths that fit shadcn-based workflows.
          - generic [ref=e825]:
            - generic [ref=e826]:
              - heading "Icon Library Features" [level=3] [ref=e827]
              - list [ref=e828]:
                - listitem [ref=e829]: Handcrafted set designed for production UI instead of generic placeholder symbol packs.
                - listitem [ref=e830]: Four visual styles including outline, solid, duotone, and filled so the same concept can match different interface densities.
                - listitem [ref=e831]: Consistent grid and stroke drawn on a shared grid so icons stay crisp and align cleanly next to text at any size.
                - listitem [ref=e832]: Fully customizable preview with controllable color, size, style, and variant settings.
                - listitem [ref=e833]: Shadcn registry compatible with CLI-friendly installation aliases for teams that want copyable delivery.
                - listitem [ref=e834]: Category-based browsing to help you find icons by product intent instead of scanning one giant undifferentiated list.
            - generic [ref=e835]:
              - heading "How Teams Use the Icon Library" [level=3] [ref=e836]
              - list [ref=e837]:
                - listitem [ref=e838]: Pick a category first when you know the product area, such as finance, notifications, settings, security, or communication.
                - listitem [ref=e839]: Switch styles to test whether the same icon works better as outline, solid, duotone, or filled within your existing UI.
                - listitem [ref=e840]: Mix styles by role within a screen, such as outline for secondary actions and filled for primary ones, to guide attention.
          - region "Frequently Asked Questions" [ref=e841]:
