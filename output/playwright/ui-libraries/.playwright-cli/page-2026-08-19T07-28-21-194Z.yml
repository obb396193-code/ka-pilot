            - region [ref=e781]:
              - generic [ref=e783]:
                - generic [ref=e784]:
                  - 'heading "Shadcn Data Grid: TanStack Table, Virtual, and DnD" [level=2] [ref=e785]'
                  - generic [ref=e786]:
                    - paragraph [ref=e787]: "ReUI Data Grid is built on TanStack Table v9 and TanStack Virtual: the headless table and virtualization engines trusted by thousands of production React apps. It handles sorting, filtering, pagination, column sizing, pinning, selection, grouping, and virtual row rendering without dictating markup."
                    - paragraph [ref=e788]: Components cover 29 real layouts including drag-and-drop rows and columns via @dnd-kit, local and remote infinite scroll, CRUD with Sonner feedback, expandable rows, sub-tables, footer aggregates, and dense or borderless visual variants.
                    - paragraph [ref=e789]: "ReUI shows every data grid component inside realistic dashboards and frame containers so you can evaluate density, sticky headers, and column controls next to real chrome: not an isolated sandbox. The sections below cover architecture, features, and integration guidance."
                - generic [ref=e790]:
                  - generic [ref=e791]:
                    - heading "What is Shadcn Data Grid?" [level=3] [ref=e792]
                    - paragraph [ref=e793]:
                      - text: "ReUI Data Grid is a custom shadcn component built on TanStack Table v9 for state management and TanStack Virtual for row and column virtualization. It exposes the full TanStack Table API: columnDef, the"
                      - generic [ref=e794]: dataGridFeatures
                      - text: "bundle, createSortedRowModel, createFilteredRowModel, createPaginatedRowModel, and more: while wrapping the markup in Tailwind-styled, accessible table primitives that follow shadcn conventions."
                    - paragraph [ref=e795]:
                      - text: Components range from simple paginated lists to full CRUD interfaces with drag-and-drop column reordering via
                      - generic [ref=e796]: "@dnd-kit/sortable"
                      - text: ", pinned rows and columns, expandable sub-tables, aggregate footers, loading skeletons, and both local and server-driven infinite scroll. Every layout is shown inside a realistic frame or dashboard container so you judge composition in context."
                  - generic [ref=e797]:
                    - heading "Why Use Shadcn Data Grid?" [level=3] [ref=e798]
                    - paragraph [ref=e799]: "Admin panels, analytics dashboards, CRM tables, audit logs, and billing history all need a table that scales with data. TanStack Table v9 handles thousands of rows without re-rendering the entire DOM: TanStack Virtual extends that to tens of thousands by only mounting visible rows. Together they let you ship a fast, accessible table without building sort state, filter logic, or pagination from scratch."
                    - paragraph [ref=e800]:
                      - text: The DnD Kit integration adds drag-and-drop column reordering and row reordering that works with keyboard and pointer devices. Pair with
                      - link "Shadcn Filters" [ref=e801] [cursor=pointer]:
                        - /url: /docs/components/base/filters
                      - text: for faceted search,
                      - link "Shadcn Pagination" [ref=e802] [cursor=pointer]:
                        - /url: /components/pagination
                      - text: for standalone controls, and
                      - link "Sonner" [ref=e803] [cursor=pointer]:
                        - /url: /components/toast
                      - text: for async feedback on CRUD operations.
                  - generic [ref=e804]:
                    - heading "Libraries and ReUI Data Grid Primitives" [level=3] [ref=e805]
                    - paragraph [ref=e806]:
                      - text: ReUI Data Grid imports
                      - generic [ref=e807]: "@tanstack/react-table"
                      - text: for the headless table engine,
                      - generic [ref=e808]: "@tanstack/react-virtual"
                      - text: for row virtualization,
                      - generic [ref=e809]: "@dnd-kit/core"
                      - text: and
                      - generic [ref=e810]: "@dnd-kit/sortable"
                      - text: for drag-and-drop, and Sonner for toast feedback.
                      - generic [ref=e811]: class-variance-authority
                      - text: handles variant styling across dense, bordered, striped, and borderless layouts.
                    - paragraph [ref=e812]: The ScrollArea primitive wraps the table for overflow control. Frame containers group data grid components with toolbars, filter bars, and pagination into shippable dashboard blocks rather than bare table demos.
                  - generic [ref=e813]:
                    - heading "Shadcn Data Grid Features" [level=3] [ref=e814]
                    - list [ref=e815]:
                      - listitem [ref=e816]:
                        - text: TanStack Table Core. Powered by TanStack Table v9. Full access to createSortedRowModel, createFilteredRowModel, createPaginatedRowModel, and the rest of the
                        - generic [ref=e817]: dataGridFeatures
                        - text: "bundle: headless, typed, and framework-agnostic state."
                      - listitem [ref=e818]: TanStack Virtual Row Virtualization. TanStack Virtual renders only visible rows in the DOM. Handles tens of thousands of rows without layout shift, supports overscan, and works with both fixed and dynamic row heights.
                      - listitem [ref=e819]:
                        - text: Drag and Drop Rows and Columns. Built on
                        - generic [ref=e820]: "@dnd-kit/core"
                        - text: and
                        - generic [ref=e821]: "@dnd-kit/sortable"
                        - text: . Reorder rows or move columns with pointer and keyboard. Drag overlays prevent layout jump during active drags.
                      - listitem [ref=e822]: Column Pinning. Pin columns to the left or right so identity columns (name, ID) and action columns (edit, delete) stay visible while users scroll wide datasets horizontally.
                      - listitem [ref=e823]: Row Pinning. Sticky row support keeps summary rows, totals, or selected records fixed at the top or bottom of the visible viewport across scroll.
                      - listitem [ref=e824]: Column Resizing. Drag column edges to resize width. Respects min and max constraints and persists across re-renders through TanStack Table column sizing state.
                      - listitem [ref=e825]: Sortable Columns. Click-to-sort with multi-column sort support, directional indicators, and controlled or uncontrolled sort state. Integrates cleanly with server-side sort APIs via manualSorting.
                      - listitem [ref=e826]:
                        - text: Column Visibility Controls. Show or hide columns at runtime via a dropdown panel. State is serializable for URL persistence with
                        - generic [ref=e827]: nuqs
                        - text: or localStorage, enabling shareable filtered views.
                      - listitem [ref=e828]: Pagination and Infinite Scroll. Switch between client-side pagination, local infinite scroll, and remote infinite scroll. The remote component integrates with SWR, React Query, or Next.js Server Actions for cursor-based APIs.
                      - listitem [ref=e829]: Row Selection and CRUD. Single and multi-row selection with indeterminate checkbox states. Full CRUD components with inline editing, confirm dialogs, row action menus, and Sonner toast feedback for async save and delete.
                      - listitem [ref=e830]: "Expandable Rows and Sub-Tables. Expand rows to reveal nested detail panels or full sub-tables: useful for order lines, log entries, invoice items, or hierarchical entity relationships."
                      - listitem [ref=e831]: Footer Aggregates. Column totals, summary stats, and per-column aggregate footers for financial tables, inventory dashboards, and reporting views.
                      - listitem [ref=e832]: Loading Skeleton. Column-aware skeleton state renders placeholder rows while data loads. Matches real row density to prevent layout shift and signal correct table structure before data arrives.
                      - listitem [ref=e833]:
                        - text: Dense, Striped, and Borderless Layouts. Variant system built with
                        - generic [ref=e834]: class-variance-authority
                        - text: . Switch between default, dense, borderless, striped, and card-container layouts to match audit logs, dashboards, or data-heavy admin views.
                      - listitem [ref=e835]: Sticky Header. Header row stays visible as users scroll through long datasets. Works with column pinning and column visibility controls for maximum navigability in wide tables.
                  - generic [ref=e836]:
                    - 'heading "ReUI Data Grid: In-House Custom Shadcn Component" [level=3] [ref=e837]'
                    - paragraph [ref=e838]:
                      - text: "ReUI Data Grid is an in-house component built and maintained by the ReUI team as part of the ReUI open-source library. It is designed to integrate seamlessly into any shadcn/ui project: following the same copy-and-own installation model. The component source lands directly in your repository; you own it, extend it, and style it with your Tailwind CSS tokens. ReUI Data Grid is a comprehensive custom component not available in base shadcn/ui. It is built on"
                      - generic [ref=e839]: "@tanstack/react-table"
                      - text: for headless table state,
                      - generic [ref=e840]: "@tanstack/react-virtual"
                      - text: for row virtualization, and
                      - generic [ref=e841]: "@dnd-kit/core"
                      - text: with
                      - generic [ref=e842]: "@dnd-kit/sortable"
                      - text: "for accessible drag-and-drop. The component ships as 10 composable sub-files covering the table, DnD rows, DnD columns, virtual table, scroll area, column header, column filter, column visibility, and pagination: each independently importable."
                    - paragraph [ref=e843]:
                      - text: "The component is available in two API flavors to match your primitive stack: a Radix UI version for teams using Radix-based shadcn primitives, and a Base UI version for teams on"
                      - generic [ref=e844]: "@base-ui/react"
                      - text: ". Both versions share identical visual output and Tailwind CSS styling: only the underlying headless primitive differs. ReUI maintains 10+ such in-house components, all available in both Radix and Base UI versions, each with dedicated documentation covering the full component API, usage examples, and prop references."
