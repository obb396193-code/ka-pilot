html,body,#root {

  margin: 0;
}
body {
  font-family: "Avenir Next","PingFang SC",sans-serif;
  background: #f3f0e8;
  color: #171717;
}
.preview-shell {
  min-height: 100vh;
  min-width: 0;
  padding: 28px;
  background: radial-gradient(circle at 85% 10%,rgba(207,255,42,.34),transparent 28%),#f3f0e8;
}
.preview-heading {
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(260px,.72fr);
  gap: 28px;
  align-items: end;
  border-bottom: 1px solid #171717;
  padding-bottom: 18px;
  margin-bottom: 20px;
}
.preview-heading span,.demo-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .16em;
  color: #f15c32;
}
.preview-heading h1 {
  font-family: Georgia,"Songti SC",serif;
  font-size: clamp(38px,6vw,74px);
  line-height: .92;
  margin: 6px 0 0;
}
.preview-heading p {
  color: #5f5b53;
  line-height: 1.65;
  margin: 0;
}
.preview-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 18px;
}
.preview-grid-wide {
  display: grid;
  grid-template-columns: minmax(0,1fr);
  gap: 18px;
}
.demo-card {
  min-width: 0;
  border: 1px solid #1c1c1c;
  border-radius: 22px;
  background: rgba(255,255,255,.82);
  padding: 20px;
  box-shadow: 0 10px 30px rgba(33,28,19,.07);
}
[data-preview-source="reui"] .demo-card {
  overflow-x: auto;
}
.demo-label {
  margin-bottom: 18px;
}
.demo-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #171717;
  border-radius: 999px;
  background: #ceff2a;
  color: #171717;
  padding: 9px 15px;
  font-weight: 700;
  font-size: 13px;
  transition: transform .18s ease,box-shadow .18s ease;
}
.demo-action:hover {
  transform: translateY(-1px);
  box-shadow: 3px 3px 0 #171717;
}
.demo-action:focus-visible {
  outline: 3px solid #f15c32;
  outline-offset: 3px;
}
.demo-note {
  margin: 14px 0 0;
  color: #6b675f;
  font-size: 12px;
  line-height: 1.6;
}
@media (max-width:720px) {
  .preview-shell {
    padding: 18px;
  }
  .preview-heading {
    grid-template-columns: 1fr;
  }
  .preview-grid {
    grid-template-columns: 1fr;
  }
  .preview-heading h1 {
    font-size: 44px;
  }
}

  *,*::before,*::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
