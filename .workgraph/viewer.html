    (() => {
      const graph = JSON.parse(document.getElementById("graph-data").textContent);
      const detail = document.getElementById("detail");
      const escapeText = (value) => String(value ?? "");
      document.querySelectorAll("[data-node]").forEach((button) => {
        button.addEventListener("click", () => {
          const node = graph.nodes.find((item) => item.id === button.dataset.node);
          if (!node) return;
          detail.replaceChildren();
          const title = document.createElement("h2");
          title.textContent = node.title;
          const description = document.createElement("p");
          description.textContent = node.description || "暂无补充说明";
          const grid = document.createElement("div");
          grid.className = "detail-grid";
          [
            ["执行者", node.agent || "未分配"],
            ["交付物", node.output || "未定义"],
            ["真实依赖", node.depends_on.length ? node.depends_on.join("、") : "无"],
          ].forEach(([label, value]) => {
            const item = document.createElement("div");
            const labelNode = document.createElement("span");
            const valueNode = document.createElement("strong");
            labelNode.textContent = escapeText(label);
            valueNode.textContent = escapeText(value);
            item.append(labelNode, valueNode);
            grid.append(item);
          });
          detail.append(title, description, grid);
        });
      });
